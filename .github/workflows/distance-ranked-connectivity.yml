name: Distance-ranked connectivity research

on:
  push:
    branches: ["research/distance-ranked-connectivity"]
    paths:
      - "middleout3d/**"
      - "tests/**"
      - ".github/workflows/distance-ranked-connectivity.yml"
      - "requirements.txt"
      - "requirements-benchmark.txt"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-benchmark.txt
      - name: Install benchmark dependencies
        run: python -m pip install -r requirements-benchmark.txt
      - name: Generate deterministic fixtures
        run: python -m middleout3d generate-fixtures --out samples
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark complete payloads
        run: python -m middleout3d benchmark-ranked-connectivity samples --out results/distance-ranked-connectivity.json --bits 16 --repeats 3
      - name: Validate benchmark and archive results
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("results/distance-ranked-connectivity.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if not report["results"]:
              raise SystemExit("No paired results recorded.")
          summary = report["summary"]
          if not summary["all_topology_exact"]:
              raise SystemExit("At least one topology equivalence check failed.")
          if not summary["all_error_budgets_met"]:
              raise SystemExit("At least one candidate exceeded the common error budget.")

          print("SUMMARY | " + " | ".join(
              f"{key}={value}" for key, value in summary.items()
          ))
          for row in report["results"]:
              print(
                  f"CASE | {row['mesh']} | {row['vertex_ordering']} | "
                  f"baseline={row['baseline']['bytes']} B | "
                  f"global={row['distance_ranked']['bytes']} B "
                  f"({row['size_reduction_vs_baseline_pct']}%) | "
                  f"local={row['local_distance_ranked']['bytes']} B "
                  f"({row['local_size_reduction_vs_baseline_pct']}%) | "
                  f"encode-ms global/local={row['distance_ranked']['encode_median_ms']}/"
                  f"{row['local_distance_ranked']['encode_median_ms']}"
              )
          for error in report["errors"]:
              print(f"UNSUPPORTED | {error['file']} | {error['ordering']} | {error['error']}")

          log_path = Path("research/distance-ranked-connectivity/EXPERIMENT_LOG.md")
          with log_path.open("a", encoding="utf-8") as handle:
              handle.write("\n\n## E001 — complete-payload distance-rank benchmark\n\n")
              handle.write(f"- GitHub Actions run: {os.environ['RUN_URL']}\n")
              handle.write(f"- Source commit tested: {os.environ['SOURCE_SHA']}.\n")
              handle.write("- Configuration: six deterministic synthetic fixtures, 16-bit positions, source/BFS/Morton vertex orderings, and three encode/decode timing repetitions.\n")
              handle.write("- Paired summary: " + "; ".join(f"{key}={value}" for key, value in summary.items()) + ".\n")
              handle.write("- Unsupported mesh/order cases: " + (json.dumps(report["errors"], sort_keys=True) if report["errors"] else "none") + ".\n")
              handle.write("- The report stores full bitstream, connectivity-stream, encode/decode, max-error, RMSE, topology and error-budget metrics for baseline, global rank and local rank. A positive result is limited to this synthetic corpus and does not imply Draco superiority.\n")

          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/distance-ranked-connectivity.json results/distance-ranked-connectivity.csv research/distance-ranked-connectivity/EXPERIMENT_LOG.md
          if git diff --cached --quiet; then
            echo "No research artifacts changed."
          else
            git commit -m "[skip ci] research: archive distance-ranked connectivity benchmark"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
