name: Benchmark sample meshes

on:
  push:
    branches: [main]
    paths:
      - "middleout3d/**"
      - "tests/**"
      - ".github/workflows/benchmark.yml"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      bits:
        description: Position quantization bits (8-24)
        required: true
        default: "16"
      repeats:
        description: Repetitions per measurement
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate deterministic benchmark meshes
        run: python -m middleout3d generate-fixtures --out samples
      - name: Run baseline versus Prithvi benchmark across orderings
        run: |
          python -m middleout3d benchmark samples --out results/ci-benchmark.json --bits "${{ github.event.inputs.bits || '16' }}" --repeats "${{ github.event.inputs.repeats || '5' }}"
      - name: Print per-mesh comparison summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open("results/ci-benchmark.json", encoding="utf-8"))
          print("mesh | ordering | baseline B | Prithvi B | size delta % | baseline enc/dec ms | Prithvi enc/dec ms | topology | same quantized coordinates")
          for row in report["results"]:
              for result in row["ordering_results"]:
                  print(
                      f'{row["name"]} | {result["ordering"]} | {result["baseline_bytes"]} | {result["prithvi_bytes"]} | '
                      f'{result["prithvi_size_reduction_vs_baseline_pct"]}% | '
                      f'{result["baseline_encode_median_ms"]}/{result["baseline_decode_median_ms"]} | '
                      f'{result["prithvi_encode_median_ms"]}/{result["prithvi_decode_median_ms"]} | '
                      f'{result["baseline_topology_exact"] and result["prithvi_topology_exact"]} | '
                      f'{result["quantized_positions_equal"]}'
                  )
          if report["errors"]:
              print("BENCHMARK ERRORS:", report["errors"])
              raise SystemExit(1)
          if not all(
              result["baseline_topology_exact"]
              and result["prithvi_topology_exact"]
              and result["quantized_positions_equal"]
              for row in report["results"]
              for result in row["ordering_results"]
          ):
              raise SystemExit("Ordering remapping or Prithvi reconstruction checks failed")
          PY
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: middleout3d-benchmark-${{ github.event.inputs.bits || '16' }}bits
          path: |
            results/ci-benchmark.json
            results/ci-benchmark.csv
