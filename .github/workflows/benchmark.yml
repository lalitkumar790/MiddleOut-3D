name: Benchmark sample meshes

on:
  push:
    branches: [main]
    paths:
      - "middleout3d/**"
      - "tests/**"
      - ".github/workflows/benchmark.yml"
      - "requirements.txt"
      - "requirements-benchmark.txt"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      bits:
        description: Position quantization bits (8-24)
        required: true
        default: "16"
      repeats:
        description: Repetitions per measurement
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-benchmark.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-benchmark.txt
      - name: Generate deterministic benchmark meshes
        run: python -m middleout3d generate-fixtures --out samples
      - name: Run baseline, Prithvi, tangent, weighted tangent, and adaptive comparison across orderings
        run: |
          python -m middleout3d benchmark samples --out results/ci-benchmark.json --bits "${{ github.event.inputs.bits || '16' }}" --repeats "${{ github.event.inputs.repeats || '5' }}"
      - name: Print per-mesh comparison summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open("results/ci-benchmark.json", encoding="utf-8"))
          print("mesh | order | baseline B | weighted B | Chandas B | adaptive Chandas B | adaptive save vs weighted % | NF ratio | Draco B | Draco bits | error target met | adaptive best")
          for row in report["results"]:
              for result in row["ordering_results"]:
                  print(
                      f'{row["name"]} | {result["ordering"]} | {result["baseline_bytes"]} | {result["prithvi_bytes"]} | '
                      f'{result["tangent_bytes"]} | {result["weighted_tangent_bytes"]} | {result["normal_fine_tangent_bytes"]} | '
                      f'{result["chandas_tangent_bytes"]} | {result["chandas_adaptive_tangent_bytes"]} | '
                      f'{result["chandas_adaptive_tangent_size_reduction_vs_weighted_pct"]}% | '
                      f'{result["normal_fine_tangent_normal_step_ratio"]} | {result["draco_bytes"]} | '
                      f'{result["draco_quantization_bits"]} | {result["draco_error_budget_met"]} | '
                      f'{row["best_candidate_method"]}/{row["best_candidate_ordering"]}/{row["best_candidate_bytes"]} B'
                  )
          if report["errors"]:
              print("BENCHMARK ERRORS:", report["errors"])
              raise SystemExit(1)
          for row in report["results"]:
              for result in row["ordering_results"]:
                  if not result["quantized_positions_equal"]:
                      raise SystemExit(f'Prithvi quantized positions differ: {row["name"]}/{result["ordering"]}')
                  for method in ("baseline", "prithvi", "tangent", "weighted_tangent", "normal_fine_tangent", "chandas_tangent", "chandas_adaptive_tangent"):
                      metrics = result["candidate_metrics"][method]
                      if not metrics["topology_exact"]:
                          raise SystemExit(f'Topology reconstruction failed: {row["name"]}/{result["ordering"]}/{method}')
                      if metrics["max_vertex_error"] > row["max_error_bound_estimate"] * 1.0001 + 1e-12:
                          raise SystemExit(f'Geometry error bound exceeded: {row["name"]}/{result["ordering"]}/{method}')
                  if not result["draco_topology_equivalent"]:
                      raise SystemExit(f'Draco topology reconstruction failed: {row["name"]}/{result["ordering"]}')
                  if not result["draco_error_budget_met"]:
                      raise SystemExit(f'Draco could not meet the max-error budget in its tested quantization range: {row["name"]}/{result["ordering"]}')

          PY
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: middleout3d-benchmark-${{ github.event.inputs.bits || '16' }}bits
          path: |
            results/ci-benchmark.json
            results/ci-benchmark.csv
