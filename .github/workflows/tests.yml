name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate deterministic test meshes
        run: python -m middleout3d generate-fixtures --out samples
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI encode/decode smoke test
        run: |
          python -m middleout3d encode samples/icosphere.obj --out /tmp/icosphere.mo3d --bits 16
          python -m middleout3d decode /tmp/icosphere.mo3d --out /tmp/icosphere-decoded.obj
          python -m middleout3d encode samples/icosphere.obj --out /tmp/icosphere-weighted.mo3d --bits 16 --method weighted_tangent --ordering bfs
          python -m middleout3d decode /tmp/icosphere-weighted.mo3d --out /tmp/icosphere-weighted-decoded.obj
          python -m middleout3d encode samples/icosphere.obj --out /tmp/icosphere-auto.mo3d --bits 16 --method auto
          python -m middleout3d decode /tmp/icosphere-auto.mo3d --out /tmp/icosphere-auto-decoded.obj
