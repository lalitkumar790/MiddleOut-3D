[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "middleout3d"
version = "0.1.0"
description = "Experimental 3D mesh compression codec and reproducible benchmark harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "trimesh>=4.0"]

[project.scripts]
middleout3d = "middleout3d.cli:main"

[tool.setuptools.packages.find]
include = ["middleout3d*"]
